name: Lint Tests
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: test-lint
  cancel-in-progress: true

jobs:
  typo-checks:
    name: Typo Checks
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
      - name: Check for Typos
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # 1.49.0
